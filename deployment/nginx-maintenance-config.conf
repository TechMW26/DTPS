# ════════════════════════════════════════════════════════════════
# Nginx Maintenance Page Configuration
# ════════════════════════════════════════════════════════════════
# 
# Add this to your Nginx server block in /etc/nginx/sites-available/dtps
# After 'server {' and any other location blocks
#
# USAGE:
# 1. Copy this entire block into your server {} section
# 2. Run: sudo nginx -t
# 3. Run: sudo systemctl reload nginx
#
# To manually trigger maintenance mode:
#   Uncomment the 'location /' block below (temporarily)
#   Then run: sudo nginx -t && sudo systemctl reload nginx
# ════════════════════════════════════════════════════════════════

# Serve maintenance page on 502, 503, 504 errors (upstream down, restarting, etc.)
error_page 502 503 504 /maintenance.html;

# Serve the maintenance page without exposing the location
location = /maintenance.html {
  root /var/www/html;
  internal;
  # Cache this page briefly so it's served immediately even during restart
  expires 1m;
  add_header Cache-Control "public, max-age=60";
}

# Serve maintenance.html without errors if it's requested directly
location /maintenance.html {
  root /var/www/html;
  expires 1m;
  add_header Cache-Control "public, max-age=60";
}

# ════════════════════════════════════════════════════════════════
# OPTIONAL: Temporary manual maintenance mode
# ════════════════════════════════════════════════════════════════
# Uncomment this block to force ALL traffic to maintenance page
# Remove the comments before redeploying
#
# location / {
#   return 503;
# }
#
# Then reload: sudo systemctl reload nginx
# After deployment, comment it back out and reload again
# ════════════════════════════════════════════════════════════════
